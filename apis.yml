name: Aruna
description: >-
  Aruna is Indonesia's largest integrated fisheries commerce platform, on a mission to make the sea a
  better livelihood for all by building a fair and sustainable fisheries ecosystem. Aruna connects more
  than 40,000 small-scale fishermen to domestic and global markets using technology, a network of
  processing partners, and 177+ distribution hubs (Aruna Hubs) across the Indonesian archipelago,
  trading 23+ seafood commodity types into 31+ countries. The company pairs commerce with sustainability
  work, including fisherman education, fish-population tracking, and coastal-community empowerment. Aruna
  is a portfolio company of Prosus Ventures and was added to the API Evangelist network as a company lead;
  it publishes no public API, developer portal, or machine-readable API surface at this time.
